<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HQ / Orca Operations — 화면기획</title>
<style>
:root{
  --bg:#f6f4ef;
  --surface:#ffffff;
  --surface-alt:#f0ede6;
  --border:#e2ddd2;
  --border-strong:#cfc8b8;
  --text:#1f2430;
  --text-muted:#68707e;
  --text-faint:#96a0ab;
  --navy:#0e1a2b;
  --navy-alt:#152238;
  --navy-text:#c9d3e0;
  --navy-text-dim:#7f8ea3;
  --emerald:#04815f;
  --emerald-bg:#e5f4ee;
  --emerald-border:#bfe3d3;
  --blue:#1d4ed8;
  --blue-bg:#e9f0ff;
  --blue-border:#c3d6fb;
  --amber:#92400e;
  --amber-bg:#fbf0dd;
  --amber-border:#f0dcb0;
  --red:#a3241a;
  --red-bg:#fbeae8;
  --red-border:#f2c9c4;
  --gray-bg:#eceae4;
  --gray-border:#d8d3c6;
  --radius:10px;
  --shadow:0 1px 2px rgba(20,20,10,.05), 0 4px 14px rgba(20,20,10,.06);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none!important}
button{font-family:inherit}
a{color:var(--blue)}

/* ---------- layout shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.sim-strip{
  background:var(--amber-bg);
  color:var(--amber);
  border-bottom:1px solid var(--amber-border);
  font-size:12px;
  font-weight:600;
  letter-spacing:.02em;
  text-align:center;
  padding:5px 12px;
}
.shell{display:flex;flex:1;min-height:0}

/* sidebar */
.sidebar{
  width:216px;flex:none;
  background:var(--navy);
  color:var(--navy-text);
  display:flex;flex-direction:column;
  padding:16px 10px 16px;
}
.brand{padding:6px 10px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.brand .name{font-size:14.5px;font-weight:700;color:#fff;letter-spacing:-.01em}
.brand .sub{font-size:11px;color:var(--navy-text-dim);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav button{
  display:flex;align-items:center;gap:10px;
  background:transparent;border:none;color:var(--navy-text);
  text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;
  font-size:13.2px;width:100%;
}
.nav button .dot{width:6px;height:6px;border-radius:50%;background:var(--navy-text-dim);flex:none}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.active{background:var(--navy-alt);color:#fff;font-weight:600}
.nav button.active .dot{background:var(--emerald)}
.nav button:focus-visible{outline:2px solid #6ea8fe;outline-offset:1px}
.nav-footer{margin-top:auto;padding:10px;font-size:11px;color:var(--navy-text-dim);border-top:1px solid rgba(255,255,255,.08)}

/* topbar */
.topbar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:10px 20px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.conn-pill{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border-strong);border-radius:999px;
  padding:4px 10px 4px 8px;font-size:12px;font-weight:600;background:var(--surface-alt);
  white-space:nowrap;
}
.conn-pill .sample-tag{font-weight:700;font-size:9.5px;letter-spacing:.04em;color:var(--text-faint);border:1px solid var(--gray-border);border-radius:4px;padding:1px 4px;margin-left:4px}
.conn-dot{width:7px;height:7px;border-radius:50%}
.conn-dot.ok{background:var(--emerald)}
.conn-dot.warn{background:var(--amber)}
.conn-dot.bad{background:var(--red)}
.conn-dot.unk{background:var(--text-faint)}
.topbar .spacer{flex:1}
.topbar .collected{font-size:12px;color:var(--text-muted)}
.scenario-control{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
.scenario-control select{
  border:1px solid var(--border-strong);border-radius:7px;padding:5px 8px;background:var(--surface);
  font-size:12.5px;color:var(--text);
}

/* main */
.main{flex:1;min-width:0;overflow-y:auto;padding:22px 26px 60px}
.view-head{margin-bottom:16px}
.view-head h1{font-size:19px;margin:0 0 4px;letter-spacing:-.01em}
.view-head p{margin:0;color:var(--text-muted);font-size:13px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){ .grid-2,.grid-3{grid-template-columns:1fr} }

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)}
.card-head h2{font-size:14.5px;margin:0}
.card-head .meta{font-size:11.5px;color:var(--text-faint)}

.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.stat .label{font-size:11.5px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center}
.stat .value{font-size:20px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.stat .note{font-size:11px;color:var(--text-faint);margin-top:3px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge.hq{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-border)}
.badge.orca{background:var(--emerald-bg);color:var(--emerald);border-color:var(--emerald-border)}
.badge.active{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-border)}
.badge.question{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-border)}
.badge.unknown{background:var(--gray-bg);color:#5c5748;border-color:var(--gray-border)}
.badge.completed{background:var(--emerald-bg);color:var(--emerald);border-color:var(--emerald-border)}
.badge.stopped{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.badge.sample{background:transparent;color:var(--text-faint);border-color:var(--gray-border);font-weight:700;font-size:9.5px;letter-spacing:.03em}
.badge.mock{background:var(--gray-bg);color:#5c5748;border-color:var(--gray-border);font-weight:700;font-size:10px}

/* table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-alt)}
tbody tr:last-child td{border-bottom:none}
.cell-title{font-weight:600}
.cell-sub{color:var(--text-faint);font-size:11.5px;margin-top:2px}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);
  padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);
}
.btn:hover{background:var(--surface-alt)}
.btn:focus-visible{outline:2px solid #6ea8fe;outline-offset:1px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-alt)}
.btn.accent{background:var(--emerald);border-color:var(--emerald);color:#fff}
.btn.accent:hover{filter:brightness(1.06)}
.btn.danger{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}

.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tabbar button{
  background:none;border:none;padding:9px 4px;margin-right:14px;font-size:13.5px;font-weight:600;
  color:var(--text-muted);border-bottom:2px solid transparent;cursor:pointer;
}
.tabbar button.active{color:var(--text);border-bottom-color:var(--navy)}
.tabbar button:focus-visible{outline:2px solid #6ea8fe}

.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--text)}
.field .hint{font-size:11.5px;color:var(--text-faint);margin-top:4px}
.field input[type=text],.field input[type=search],.field select,.field textarea{
  width:100%;border:1px solid var(--border-strong);border-radius:8px;padding:9px 11px;font-size:13.5px;
  background:var(--surface);color:var(--text);font-family:inherit;
}
.field textarea{resize:vertical;min-height:110px}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-card{
  flex:1;min-width:180px;border:1px solid var(--border-strong);border-radius:9px;padding:11px 12px;cursor:pointer;
}
.radio-card.selected{border-color:var(--emerald);background:var(--emerald-bg)}
.radio-card .t{font-weight:700;font-size:13px}
.radio-card .d{font-size:11.5px;color:var(--text-muted);margin-top:3px}

.explain{margin-top:12px;border:1px dashed var(--border-strong);border-radius:9px;background:var(--surface-alt)}
.explain summary{cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--text-muted);list-style:none}
.explain summary::-webkit-details-marker{display:none}
.explain summary:before{content:"▸ ";color:var(--text-faint)}
.explain[open] summary:before{content:"▾ "}
.explain .body{padding:0 14px 12px;font-size:12.5px;color:var(--text-muted)}
.explain code{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:11.5px}

.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filter-bar input[type=search]{flex:1;min-width:180px}
.filter-bar select{border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--surface)}

.attn-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.attn-item:last-child{border-bottom:none}
.attn-item .icn{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.attn-item .txt{flex:1;min-width:0}
.attn-item .txt .t{font-weight:600;font-size:13px}
.attn-item .txt .s{font-size:12px;color:var(--text-muted);margin-top:2px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(14,20,30,.42);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:var(--surface);border-radius:12px;max-width:460px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:20px}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{margin:0 0 14px;font-size:13px;color:var(--text-muted)}
.modal .actions{display:flex;justify-content:flex-end;gap:8px}

/* drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(14,20,30,.3);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:var(--surface);box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:41;overflow-y:auto;padding:18px 20px 40px}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:60}

.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px;margin:8px 0}
.kv dt{color:var(--text-faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;padding-top:1px}
.kv dd{margin:0}

.tree{list-style:none;margin:0;padding:0}
.tree li{margin:0}
.tree .row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px}
.tree .row:hover{background:var(--surface-alt)}
.tree .lvl1{padding-left:0}
.tree .lvl2{padding-left:22px}
.tree .lvl3{padding-left:44px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.cmdline{background:var(--navy);color:#d6e6ff;padding:12px 14px;border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;overflow-x:auto;white-space:pre}

.empty-state{padding:34px 18px;text-align:center;color:var(--text-muted)}
.empty-state .big{font-size:26px;margin-bottom:6px}

.link-list{margin:0;padding:0;list-style:none}
.link-list li{padding:9px 0;border-bottom:1px solid var(--border)}
.link-list li:last-child{border-bottom:none}
.link-list .n{color:var(--text-faint);font-size:11.5px;margin-right:6px}
.link-list .date{color:var(--text-faint);font-size:11.5px;margin-left:6px}

@media (max-width:880px){
  .shell{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;padding:8px 10px;align-items:center;gap:2px;row-gap:6px}
  .brand{border:none;padding:4px 10px 4px 2px;margin:0;flex:none;width:100%}
  .brand .sub{display:none}
  .nav{flex-direction:row;flex-wrap:wrap;flex:1;row-gap:6px;min-width:0;width:100%}
  .nav button{white-space:nowrap;flex:none}
  .nav-footer{display:none}
  .main{padding:16px 14px 50px}
  .kv{grid-template-columns:100px 1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="sim-strip">화면기획 · 시뮬레이션 데이터 · 실제 실행 없음</div>
  <div class="shell">
    <nav class="sidebar" aria-label="주요 화면 이동">
      <div class="brand">
        <div class="name">HQ / Orca Operations</div>

      </div>
      <div class="nav" id="nav" role="tablist" aria-label="화면 목록"></div>
      <div class="nav-footer">단일 운영자용 데스크톱 콘솔 시안<br>모든 데이터는 예시입니다</div>
    </nav>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;min-height:0">
      <header class="topbar">
        <span class="conn-pill" id="pill-hq"></span>
        <span class="conn-pill" id="pill-orca"></span>
        <span class="collected" id="collected-at"></span>
        <div class="spacer"></div>
        <div class="scenario-control">
          <label for="scenario-select">시나리오</label>
          <select id="scenario-select" aria-label="연결/데이터 시나리오 전환">
            <option value="connected">정상 연결 (기본)</option>
            <option value="disconnected">연결 끊김</option>
            <option value="unknown">상태 불확실</option>
            <option value="empty">데이터 없음</option>
          </select>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>
</div>
<div id="overlay-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
(function(){

/* ============================== 유틸 ============================== */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function qs(sel,root){ return (root||document).querySelector(sel); }
function qsa(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

function livenessUserLabel(v){
  return {live:"실행 중", exited:"종료됨", unverifiable:"판정 불가"}[v] || v;
}
function ptyUserLabel(v){
  return {live:"연결됨", exited:"종료됨", unverifiable:"관찰 불가"}[v] || v;
}
function catLabel(cat){
  return {active:"진행중", question:"질문", unknown:"확인필요", completed:"완료"}[cat] || cat;
}
function catBadge(cat){
  return '<span class="badge '+cat+'">'+catLabel(cat)+'</span>';
}
function sourceBadge(src){
  return src==="hq" ? '<span class="badge hq">HQ</span>' : '<span class="badge orca">Orca</span>';
}

function toast(msg){
  var root = qs("#toast-root");
  root.innerHTML = "";
  var t = el('<div class="toast" role="status"></div>');
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(function(){ if(root.contains(t)) root.removeChild(t); }, 3200);
}

function openOverlay(node){
  var root = qs("#overlay-root");
  root.innerHTML = "";
  root.appendChild(node);
  document.addEventListener("keydown", overlayEscHandler);
  var focusable = node.querySelector("button, input, textarea, select, [tabindex]");
  if(focusable) focusable.focus();
}
function closeOverlay(){
  qs("#overlay-root").innerHTML = "";
  document.removeEventListener("keydown", overlayEscHandler);
}
function overlayEscHandler(e){
  if(e.key === "Escape") closeOverlay();
}

function parseHash(){
  var h = location.hash.replace(/^#\/?/, "");
  var parts = h.split("/").filter(Boolean);
  if(parts.length === 0) return {view:"overview", id:null};
  return {view:parts[0], id:parts[1] || null};
}
function navigate(view, id){
  location.hash = "#/" + view + (id ? "/"+id : "");
}
window.addEventListener("hashchange", function(){
  STATE.route = parseHash();
  if(STATE.route.view === "detail") STATE.detailTab = "overview";
  render();
});

          '</dl><p class="hint" style="margin-top:6px">두 값은 다를 수 있습니다. 연결된 터미널이 있어도 에이전트가 정상이라는 보장은 아닙니다.</p>'+
          '<details class="explain" style="margin-top:8px"><summary>기획 해설</summary><div class="body">공개 CLI 원본 값: <code>projection.liveness.verdict='+esc(it.livenessProjection)+'</code>, <code>observation.status='+esc(it.ptyObservation)+'</code>. 위 라벨은 사용자용 표현이며, 실제 enum은 각각 live/exited/unverifiable입니다. 데모의 내부 진행 상태(state)와는 별개 필드입니다.</div></details>'
          : '<p class="hint">HQ 문맥에는 별도 liveness 프로젝션이 없습니다. worker.* 이벤트가 오면 연결된 Orca 실행에서 확인하세요.</p>')+
      '</div>'+
    '</div>'+
    (it.source==="orca" ? '<div class="card card-pad" style="margin-top:14px"><h3 style="margin:0 0 10px;font-size:13.5px">모델 (요청 vs 실제)</h3><dl class="kv"><dt>요청됨</dt><dd>'+esc(it.requestedModel)+'</dd><dt>실제 적용</dt><dd>'+(it.effectiveModel==="미확인"?'<span style="color:var(--text-faint)">미확인 — optional 필드 부재는 기본값으로 채우지 않음</span>':esc(it.effectiveModel))+'</dd></dl></div>' : '')+
    '<div class="card card-pad" style="margin-top:14px">'+
      '<h3 style="margin:0 0 10px;font-size:13.5px">작업</h3>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn primary" id="btn-followup">후속 지시 보내기</button>'+
        (it.source==="orca"

            '<button class="btn" id="btn-release" '+(settled?"":"disabled")+' title="'+(settled?"정산 완료됨":"미정산 상태에서는 해제할 수 없음")+'">해제 (release)</button>'
          : '')+
      '</div>'+
      (it.source==="orca" && !settled ? '<p class="hint" style="margin-top:8px">해제 버튼은 정지/완료로 정산된 뒤에만 활성화됩니다 (사유: 미정산 상태).</p>' : '')+
    '</div>';

  var timelineHtml = '<div class="card"><div class="table-wrap"><table><thead><tr><th>seq</th><th>kind</th><th>source</th><th>시각</th><th>detail</th></tr></thead><tbody>'+
    it.timeline.map(function(t){
      return '<tr><td class="mono">'+(t.seq!=null?t.seq:'—')+'</td><td>'+esc(t.kind)+'</td><td>'+sourceBadge(t.source==="orca"||t.source==="tool"?(t.source==="tool"?"hq":"orca"):"hq")+'</td><td>'+t.at+'</td><td class="mono" style="white-space:normal">'+esc(t.detail)+'</td></tr>';
    }).join("")+
    '</tbody></table></div></div>'+
    '<p class="hint" style="margin-top:8px">compaction 발생 시 <code>oldestSeq/latestSeq/snapshots</code>만 남고 개별 seq는 스냅샷으로 대체됩니다. 표시는 최신 latestSeq부터 이어집니다.</p>';

  var logHtml = '<div class="card card-pad">'+
    '<details class="explain" open><summary>원문 로그 (기본 접힘 해제 · 데모)</summary><div class="body">'+
      '<div class="cmdline">'+esc('$ orca orchestration worker-read --dispatch '+(it.dispatchId||'—')+' --source auto --limit 50 --json')+'\n'+esc('# exact transcript 우선, 없으면 labeled terminal 텍스트로 대체')+'\n[REDACTED: token/secret/password/authorization/cookie/private key/URL credential 서버 측 제거됨]\n09:1'+esc('2')+' · 요청 수신\n09:18 · 실행 시작 (예시)\n09:'+esc('40')+' · 최근 heartbeat (진행 근거 아님)</div>'+
    '</div></details>'+
    '<p class="hint" style="margin-top:10px">로그는 페이지 단위(cursor)로 이어받으며 기본 접힘 + source 표시 + redaction 정책이 적용됩니다.</p>'+
  '</div>';

  return ''+
  '<div class="view-head"><a href="#/tasks" style="font-size:12.5px;color:var(--text-muted)">← 업무 목록</a><h1 style="margin-top:6px">'+esc(it.title)+'</h1><p>'+esc(it.summary)+'</p></div>'+
  '<div class="tabbar" role="tablist">'+
    ['overview','timeline','log'].map(function(k){
      var label = {overview:"개요", timeline:"타임라인", log:"로그"}[k];
      return '<button role="tab" aria-selected="'+(tab===k)+'" data-dtab="'+k+'" class="'+(tab===k?"active":"")+'">'+label+'</button>';
    }).join("")+
  '</div>'+
  '<div>'+ (tab==="overview"?overviewHtml : tab==="timeline"?timelineHtml : logHtml) +'</div>';
}

/* ============================== 뷰: 새 지시 ============================== */
function viewCompose(){
  var mode = STATE.composerMode;
  var step = STATE.composerStep;
  var len = STATE.composerText.length;
  var over = len > 8000;

  if(step === "receipt"){
    var r = STATE.createdReceipts[STATE.createdReceipts.length-1];
    return '<div class="view-head"><h1>새 지시</h1></div>'+
      '<div class="card card-pad">'+
        '<h3 style="margin:0 0 8px">접수됨 <span class="badge active">대기열</span></h3>'+
        '<p class="hint">이 접수는 완료가 아닙니다. 실제 처리 여부는 업무 목록/상세에서 상태로 확인하세요.</p>'+
        '<dl class="kv">'+
          '<dt>모드</dt><dd>'+(r.mode==="hq"?"HQ 업무 요청":"Orca 직접 실행 (브리지 설계)")+'</dd>'+
          '<dt>requestId</dt><dd class="mono">'+r.requestId+'</dd>'+
          '<dt>상태</dt><dd><span class="badge active">queued</span></dd>'+
        '</dl>'+
        '<div style="margin-top:14px;display:flex;gap:8px">'+
          '<button class="btn primary" id="goto-created">업무 목록에서 보기</button>'+
          '<button class="btn" id="compose-again">새 지시 다시 작성</button>'+
        '</div>'+
      '</div>';
  }

  var hqFields = ''+
    '<div class="field"><label for="c-project">프로젝트/소스</label>'+
      '<select id="c-project"><option>orca-hq</option><option>internal-tools</option></select></div>'+
    '<div class="field"><label>문맥</label><div class="radio-row">'+
      '<div class="radio-card '+(STATE.composerContextMode==="new"?"selected":"")+'" data-ctx="new"><div class="t">새 문맥</div><div class="d">contextHint={mode:"new"}</div></div>'+
      '<div class="radio-card '+(STATE.composerContextMode==="continue"?"selected":"")+'" data-ctx="continue"><div class="t">기존 문맥 이어가기</div><div class="d">contextHint={mode:"continue",contextId}</div></div>'+
    '</div></div>'+
    (STATE.composerContextMode==="continue" ? '<div class="field"><label for="c-ctxid">contextId</label><input type="text" id="c-ctxid" placeholder="ctx_9f21ab"></div>' : '')+
    '<p class="hint">참고: HQ 네이티브 진행 요청(POST /v1/progress/requests)은 현재 에이전트 선택 필드를 받지 않습니다. 따라서 이 모드에는 에이전트 선택을 표시하지 않습니다.</p>';

  var orcaFields = ''+
    '<div class="field"><label for="c-project2">프로젝트/소스</label>'+
      '<select id="c-project2"><option>orca-hq</option><option>internal-tools</option></select></div>'+
    '<div class="field"><label for="c-agent">에이전트 (선택)</label><input type="text" id="c-agent" placeholder="예: claude" value="'+esc(STATE.composerAgent)+'"></div>'+
    '<div class="field"><label for="c-model">모델/effort (선택)</label><input type="text" id="c-model" placeholder="예: claude-sonnet-5 --effort medium" value="'+esc(STATE.composerModel)+'"></div>'+
    '<p class="hint">실행에는 감독 중인 coordinator/ownership 사전조건이 필요합니다. 아래 미리보기는 <b>공개 CLI 명령 참조</b>이며 실제로 실행되지 않습니다.</p>'+
    '<div class="cmdline">worker-start --spec &lt;spec&gt; --run &lt;runId&gt; --from &lt;coordinatorRef&gt; --worktree &lt;worktreeId&gt; --agent '+esc(STATE.composerAgent||'&lt;agent&gt;')+(STATE.composerModel?(' '+esc(STATE.composerModel)):' [--model &lt;model&gt;] [--effort &lt;effort&gt;]')+'</div>';

  return ''+
  '<div class="view-head"><h1>새 지시</h1><p>모드에 따라 실제 백엔드 계약이 다릅니다. 혼동되지 않도록 필드를 분리했습니다.</p></div>'+
  '<div class="card card-pad">'+
    '<div class="field"><label>모드</label><div class="radio-row">'+
      '<div class="radio-card '+(mode==="hq"?"selected":"")+'" data-mode="hq"><div class="t">HQ 업무 요청</div><div class="d">progress request API · new/continue</div></div>'+
      '<div class="radio-card '+(mode==="orca"?"selected":"")+'" data-mode="orca"><div class="t">Orca 직접 실행 (브리지 설계)</div><div class="d">공개 CLI 미리보기 · 웹 실행은 브리지 필요</div></div>'+
    '</div></div>'+
    (mode==="hq" ? hqFields : orcaFields)+
    '<div class="field"><label for="c-text">요청 내용</label>'+
      '<textarea id="c-text" placeholder="요청 내용을 입력하세요">'+esc(STATE.composerText)+'</textarea>'+
      '<div class="hint" style="display:flex;justify-content:space-between"><span>최대 8,000자</span><span style="color:'+(over?"var(--red)":"var(--text-faint)")+'">'+len+' / 8000</span></div>'+
    '</div>'+
    (step==="review" ? renderReviewBlock() : '')+
    '<div style="display:flex;gap:8px;margin-top:6px">'+
      (step==="form"
        ? '<button class="btn primary" id="btn-review" '+((len===0||over)?"disabled":"")+'>검토</button>'
        : '<button class="btn ghost" id="btn-back-form">← 수정</button><button class="btn accent" id="btn-submit">확인 후 제출 (시뮬레이션)</button>')+
    '</div>'+
  '</div>'+
  '<details class="explain" style="margin-top:14px"><summary>기획 해설</summary><div class="body">'+
    '<p>동일한 requestId+본문 재제출은 idempotent합니다. 재시도를 위해 새 ID를 만들면 의미가 달라지므로, 실제 화면에서는 재제출 전 확인 문구를 노출합니다.</p>'+
    '<p>Orca 직접 실행 모드는 "브리지 설계" 단계입니다. 지금은 read/typed-control allowlist 브리지가 없어 실제 실행 버튼이 아니라 CLI 참조 미리보기만 제공합니다.</p>'+
  '</div></details>';
}
function renderReviewBlock(){
  return '<div class="card card-pad" style="background:var(--surface-alt);margin-top:4px">'+
    '<h4 style="margin:0 0 8px;font-size:13px">제출 전 검토</h4>'+
    '<dl class="kv">'+
      '<dt>모드</dt><dd>'+(STATE.composerMode==="hq"?"HQ 업무 요청":"Orca 직접 실행 (브리지 설계)")+'</dd>'+
      '<dt>문자 수</dt><dd>'+STATE.composerText.length+' / 8000</dd>'+
    '</dl>'+
    '<p class="hint">제출해도 즉시 "접수됨(대기열)" 상태이며 완료를 의미하지 않습니다.</p>'+
  '</div>';
}

/* ============================== 뷰: 질문함 ============================== */
function viewInbox(){
  var pending = questionsList.filter(function(q){return q.state==="pending";}).length;
  return ''+
  '<div class="view-head"><h1>질문함 <span class="badge question" style="margin-left:6px">'+pending+'건 대기</span></h1><p>HQ clarification과 Orca 정확 메시지 질문을 출처별로 구분합니다.</p></div>'+
  questionsList.map(function(q){
    var linked = q.relatedId ? findItem(q.relatedId) : null;
    return '<div class="card" style="margin-bottom:12px">'+
      '<div class="card-head"><h2>'+sourceBadge(q.source)+' &nbsp;'+esc(q.channel)+'</h2>'+
        (q.state==="pending" ? '<span class="badge question">대기중</span>' : '<span class="badge completed">답변됨</span>')+
      '</div>'+
      '<div class="card-pad">'+
        '<p style="margin:0 0 10px">'+esc(q.text)+'</p>'+
        '<p class="hint">전달: '+q.deliveredAt+(linked?' · 연결: <a href="#/detail/'+linked.id+'">'+esc(linked.title)+'</a>':'')+'</p>'+
        (q.state==="answered"
          ? '<div class="card-pad" style="background:var(--surface-alt);border-radius:8px;margin-top:8px"><b>답변:</b> '+esc(q.answer)+'<div class="hint" style="margin-top:4px">'+q.answeredAt+' 처리 · 전달 확정 여부는 시뮬레이션입니다</div></div>'
          : '<div style="margin-top:8px"><textarea data-qid="'+q.id+'" rows="2" placeholder="답변 입력" style="width:100%;border:1px solid var(--border-strong);border-radius:8px;padding:8px"></textarea>'+
            '<div style="margin-top:6px"><button class="btn accent sm" data-reply="'+q.id+'">답변 전송 (시뮬레이션)</button> <span class="hint">전송 후에도 "확인 응답 대기(pending)"로 표시되며, 성공으로 단정하지 않습니다.</span></div></div>')+
      '</div>'+
    '</div>';
  }).join("");
}

/* ============================== 뷰: 프로젝트/터미널 ============================== */

            }).join("")+'</ul></li>';
        }).join("")+'</ul></li></ul>';
    }).join("")+
  '</div>'+
  '<details class="explain" style="margin-top:14px"><summary>기획 해설</summary><div class="body">'+
    '<p>"열기"는 로컬 신뢰 브리지가 아직 없으므로 실제 연결 대신 "브리지 없음 — 로컬에서 직접 여세요" 알림만 보여줍니다.</p>'+

}

    '<p>설정 변경 버튼을 두지 않은 이유: 현재 계획 단계에서는 mutation 계약을 별도로 설계해야 합니다. 선택 시 "제안됨 (미적용, 데모)" 배지만 붙습니다.</p>'+

/* ============================== 메인 렌더 & 상세 진입/닫기 ============================== */
function render(){
  renderTopbar();
  renderNav();
  var main = qs("#main");
  var view = STATE.route.view;
  var html;
  switch(view){
    case "tasks": html = viewTasks(); break;
    case "compose": html = viewCompose(); break;
    case "inbox": html = viewInbox(); break;
    case "detail": html = viewDetail(); break;
    case "projects": html = viewProjects(); break;
    case "settings": html = viewSettings(); break;
    case "research": html = viewResearch(); break;
    default: html = viewOverview();
  }
  main.innerHTML = html;
  wireView(view);
}

function wireView(view){
  qsa("[data-goto]").forEach(function(n){
    n.addEventListener("click", function(){ navigate("detail", n.getAttribute("data-goto")); });
  });

  if(view === "tasks"){
    qsa("[data-tab]").forEach(function(b){ b.addEventListener("click", function(){ STATE.tasksTab = b.getAttribute("data-tab"); render(); }); });
    var s = qs("#task-search"); if(s){ s.addEventListener("input", function(){ STATE.tasksSearch = s.value; render(); }); s.focus(); s.setSelectionRange(s.value.length,s.value.length); }
    var f = qs("#task-filter"); if(f){ f.addEventListener("change", function(){ STATE.tasksFilter = f.value; render(); }); }
  }

  if(view === "detail"){
    qsa("[data-dtab]").forEach(function(b){ b.addEventListener("click", function(){ STATE.detailTab = b.getAttribute("data-dtab"); render(); }); });
    var stopBtn = qs("#btn-stop");
    if(stopBtn) stopBtn.addEventListener("click", function(){ openStopConfirm(STATE.route.id); });
    var relBtn = qs("#btn-release");
    if(relBtn && !relBtn.disabled) relBtn.addEventListener("click", function(){ toast("해제 접수됨 (시뮬레이션) — cleanup 완료로 표시"); });
    var fu = qs("#btn-followup");
    if(fu) fu.addEventListener("click", function(){ toast("후속 지시 접수됨 (시뮬레이션) — 완료 아님"); });
  }

  if(view === "compose"){
    qsa("[data-mode]").forEach(function(n){ n.addEventListener("click", function(){ STATE.composerMode = n.getAttribute("data-mode"); STATE.composerStep = "form"; render(); }); });
    qsa("[data-ctx]").forEach(function(n){ n.addEventListener("click", function(){ STATE.composerContextMode = n.getAttribute("data-ctx"); render(); }); });
    var txt = qs("#c-text");
    if(txt){ txt.addEventListener("input", function(){ STATE.composerText = txt.value; var lenEl=main_len(); }); }
    function main_len(){ /* no-op placeholder for potential live counter refresh */ }
    if(txt) txt.addEventListener("input", function(){ STATE.composerText = txt.value; renderCounterOnly(); });
    var agentInp = qs("#c-agent"); if(agentInp) agentInp.addEventListener("input", function(){ STATE.composerAgent = agentInp.value; });
    var modelInp = qs("#c-model"); if(modelInp) modelInp.addEventListener("input", function(){ STATE.composerModel = modelInp.value; });
    var reviewBtn = qs("#btn-review"); if(reviewBtn) reviewBtn.addEventListener("click", function(){ STATE.composerStep = "review"; render(); });
    var backBtn = qs("#btn-back-form"); if(backBtn) backBtn.addEventListener("click", function(){ STATE.composerStep = "form"; render(); });
    var submitBtn = qs("#btn-submit"); if(submitBtn) submitBtn.addEventListener("click", submitComposer);
    var gotoCreated = qs("#goto-created"); if(gotoCreated) gotoCreated.addEventListener("click", function(){ var r = STATE.createdReceipts[STATE.createdReceipts.length-1]; navigate("detail", r.itemId); });
    var again = qs("#compose-again"); if(again) again.addEventListener("click", function(){ STATE.composerStep="form"; STATE.composerText=""; render(); });
  }
  function renderCounterOnly(){
    // cheap re-render keeps caret behavior acceptable for this demo scale
    var focusWasText = document.activeElement && document.activeElement.id === "c-text";
    var caret = focusWasText ? document.activeElement.selectionStart : null;
    render();
    if(focusWasText){
      var t = qs("#c-text");
      if(t){ t.focus(); if(caret!=null) t.setSelectionRange(caret, caret); }
    }
  }

  if(view === "inbox"){
    qsa("[data-reply]").forEach(function(b){
      b.addEventListener("click", function(){
        var qid = b.getAttribute("data-reply");
        var ta = qs('textarea[data-qid="'+qid+'"]');
        var val = ta ? ta.value.trim() : "";
        if(!val){ toast("답변 내용을 입력하세요"); return; }
        var q = questionsList.filter(function(x){return x.id===qid;})[0];
        if(q){
          q.state = "answered";
          q.answer = val;
          q.answeredAt = "방금";
        }
        toast("답변 전송됨 (시뮬레이션) — 확인 응답 대기");
        render();
      });
    });
  }

  if(view === "projects"){
    qsa("[data-open-term]").forEach(function(b){
      b.addEventListener("click", function(){ toast("브리지 없음 — 로컬에서 직접 여세요 (시뮬레이션 알림)"); });
    });
  }

  if(view === "settings"){
    var note = qs("#settings-note");
    qsa(".radio-card").forEach(function(c){
      c.addEventListener("click", function(){
        qsa(".radio-card").forEach(function(x){x.classList.remove("selected");});
        c.classList.add("selected");
        if(note) note.textContent = "제안됨 (미적용, 데모) — 실제 config 반영 없음";
      });
    });
  }
}

function submitComposer(){
  var id = STATE.composerMode === "hq" ? "hq-new-"+Date.now() : "orca-new-"+Date.now();
  var newItem = STATE.composerMode === "hq"
    ? {id:id, source:"hq", cat:"active", title:"[신규] "+(STATE.composerText.slice(0,28)||"제목 없음"), summary:"방금 접수됨 (대기열) — 완료 아님",
       contextId:STATE.composerContextMode==="continue"?"ctx_기존":"ctx_new_"+Math.floor(Math.random()*9000), requestId:"req_"+Math.floor(Math.random()*90000),
       sessionId:"sess_kr-ops", state:"queued", updatedAt:"방금", createdAt:"방금", linkedOrcaId:null,
       timeline:[{seq:null,kind:"progress.request.created",source:"tool",at:"방금",detail:"시뮬레이션 제출"}]}
    : {id:id, source:"orca", cat:"active", title:"[신규] Orca 직접 실행 미리보기", summary:"브리지 프리뷰 전송됨 (실행 아님)",
       runId:"run_new", taskId:"task_new", dispatchId:"disp_new_"+Math.floor(Math.random()*9000),
       state:"preview_sent", updatedAt:"방금", createdAt:"방금", linkedHqId:null,
       requestedModel:STATE.composerModel||"미지정", effectiveModel:"미확인",
      livenessProjection:"unverifiable", ptyObservation:"unverifiable",
       timeline:[{seq:null,kind:"bridge.preview.sent",source:"system",at:"방금",detail:"실제 worker-start 실행 없음 (설계 단계)"}]};
  itemsList.unshift(newItem);
  STATE.createdReceipts.push({mode:STATE.composerMode, requestId: newItem.requestId || newItem.dispatchId, itemId:id});
  STATE.composerStep = "receipt";
  render();
}

/* ---- 정지 확인 모달 ---- */
function openStopConfirm(itemId){
  var it = findItem(itemId);
  if(!it || it.livenessProjection !== "live" || it.ptyObservation !== "live" || it.state === "stopped"){
    toast("정지할 수 없음 — 최신 liveness/PTY가 live인지 먼저 확인하세요");
    return;
  }
  var node = el(
    '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="stop-title">'+
      '<div class="modal">'+
        '<h3 id="stop-title">정지 요청 확인</h3>'+
        '<p>"'+esc(it.title)+'"에 대해 supervised agent terminal만 정지합니다. worktree나 다른 tab은 삭제되지 않습니다. 계속할까요?</p>'+
        '<div class="actions">'+
          '<button class="btn ghost" id="stop-cancel">취소</button>'+
          '<button class="btn danger" id="stop-confirm">정지 확인</button>'+
        '</div>'+
      '</div>'+
    '</div>'
  );
  openOverlay(node);
  qs("#stop-cancel", node).addEventListener("click", closeOverlay);
  node.addEventListener("click", function(e){ if(e.target === node) closeOverlay(); });
  qs("#stop-confirm", node).addEventListener("click", function(){
    it.state = "stopped";
    it.cat = "completed";
    it.livenessProjection = "exited";
    it.ptyObservation = "exited";
    it.updatedAt = "방금";
    it.timeline.push({seq:null,kind:"worker-stop 접수",source:"orca",at:"방금",detail:"확인 화면 통과 후 실행"});
    it.timeline.push({seq:null,kind:"stop settlement receipt",source:"orca",at:"방금",detail:"synthetic receipt: stop accepted and outcome settled; confirmation click alone is not authoritative"});
    closeOverlay();
    toast("정지 완료 접수됨 (positive receipt)");
    render();
  });
}

/* ============================== 초기화 ============================== */
qs("#scenario-select").addEventListener("change", function(e){ STATE.scenario = e.target.value; render(); });

STATE.route = parseHash();
render();
})();
</script>
