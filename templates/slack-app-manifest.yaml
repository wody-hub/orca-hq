_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Orca HQ
features:
  bot_user:
    display_name: Orca HQ
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - chat:write
settings:
  socket_mode_enabled: true
  interactivity:
    is_enabled: true
  event_subscriptions:
    bot_events:
      - message.channels
  org_deploy_enabled: false
  token_rotation_enabled: false
